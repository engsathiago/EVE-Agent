services:
  - type: web
    name: eve
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: EVE_GATEWAY_PORT
        value: "8080"
      - key: EVE_STATE_DIR
        value: /data/.eve
      - key: EVE_WORKSPACE_DIR
        value: /data/workspace
      - key: EVE_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: eve-data
      mountPath: /data
      sizeGB: 1
