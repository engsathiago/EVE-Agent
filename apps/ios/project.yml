name: EVE
options:
  bundleIdPrefix: ai.evefoundation
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  EVEKit:
    path: ../shared/EVEKit
  Swabble:
    path: ../swabble
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 147.0.0

schemes:
  EVE:
    shared: true
    build:
      targets:
        EVE: all
    test:
      targets:
        - EVETests
        - EVELogicTests
  EVELogicTests:
    shared: true
    build:
      targets:
        EVELogicTests: all
    test:
      targets:
        - EVELogicTests
  EVEUITests:
    shared: true
    build:
      targets:
        EVEUITests: all
    test:
      targets:
        - EVEUITests
  EVEWatchApp:
    shared: true
    build:
      targets:
        EVEWatchApp: all

targets:
  EVE:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
    dependencies:
      - target: EVEShareExtension
        embed: true
      - target: EVEActivityWidget
        embed: true
      # A companion watch application belongs in the standard Watch bundle location.
      # PlugIns is for extension products and breaks paired watch installation.
      - target: EVEWatchApp
      - package: EVEKit
      - package: EVEKit
        product: EVEChatUI
      - package: EVEKit
        product: EVEProtocol
      - package: Swabble
        product: SwabbleKit
      - package: WebRTC
      - sdk: AppIntents.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftformat >/dev/null 2>&1; then
            echo "error: swiftformat not found (brew install swiftformat)" >&2
            exit 1
          fi
          swiftformat --lint --config "$SRCROOT/../../config/swiftformat" \
            --unexclude "$SRCROOT/Sources,$SRCROOT/ShareExtension,$SRCROOT/ActivityWidget,$SRCROOT/WatchApp,$SRCROOT/../shared/EVEKit,$SRCROOT/../swabble" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint not found (brew install swiftlint)" >&2
            exit 1
          fi
          swiftlint lint --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(EVE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: Sources/EVE.entitlements
        CODE_SIGN_STYLE: "$(EVE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(EVE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(EVE_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(EVE_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          EVE_APNS_ENTITLEMENT_ENVIRONMENT: development
          EVE_PUSH_TRANSPORT: direct
          EVE_PUSH_DISTRIBUTION: local
          EVE_PUSH_RELAY_BASE_URL: ""
          EVE_PUSH_APNS_ENVIRONMENT: sandbox
        Release:
          EVE_APNS_ENTITLEMENT_ENVIRONMENT: production
          EVE_PUSH_TRANSPORT: direct
          EVE_PUSH_DISTRIBUTION: local
          EVE_PUSH_RELAY_BASE_URL: ""
          EVE_PUSH_APNS_ENVIRONMENT: production
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: EVE
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: ai.evefoundation.app
            CFBundleURLSchemes:
              - eve
        CFBundleShortVersionString: "$(EVE_MARKETING_VERSION)"
        EVECanonicalVersion: "$(EVE_IOS_VERSION)"
        EVEAppGroupIdentifier: "$(EVE_APP_GROUP_ID)"
        CFBundleVersion: "$(EVE_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - "$(EVE_APP_BUNDLE_ID).bgrefresh"
        NSLocalNetworkUsageDescription: EVE discovers and connects to your EVE gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _eve-gw._tcp
        NSCameraUsageDescription: EVE can capture photos or short video clips when requested via the gateway.
        NSCalendarsUsageDescription: EVE uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsFullAccessUsageDescription: EVE uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsWriteOnlyAccessUsageDescription: EVE uses your calendars to add events when you enable calendar access.
        NSContactsUsageDescription: EVE uses your contacts so you can search and reference people while using the assistant.
        NSLocationWhenInUseUsageDescription: EVE uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: EVE can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: EVE uses the microphone for realtime chat, voice wake, and push-to-talk.
        NSMotionUsageDescription: EVE may use motion data to support device-aware interactions and automations.
        NSPhotoLibraryUsageDescription: EVE needs photo library access when you choose existing photos to share with your assistant.
        NSRemindersFullAccessUsageDescription: EVE uses your reminders to list, add, and complete tasks when you enable reminders access.
        NSSpeechRecognitionUsageDescription: EVE uses on-device speech recognition for talk mode and voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        EVEPushTransport: "$(EVE_PUSH_TRANSPORT)"
        EVEPushDistribution: "$(EVE_PUSH_DISTRIBUTION)"
        EVEPushRelayBaseURL: "$(EVE_PUSH_RELAY_BASE_URL)"
        EVEPushAPNsEnvironment: "$(EVE_PUSH_APNS_ENVIRONMENT)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  EVEShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
    dependencies:
      - package: EVEKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(EVE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: ShareExtension/EVEShareExtension.entitlements
        CODE_SIGN_STYLE: "$(EVE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(EVE_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(EVE_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(EVE_SHARE_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: EVE Share
        CFBundleShortVersionString: "$(EVE_MARKETING_VERSION)"
        EVEAppGroupIdentifier: "$(EVE_APP_GROUP_ID)"
        CFBundleVersion: "$(EVE_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  EVEActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/EVEActivityAttributes.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(EVE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(EVE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(EVE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(EVE_ACTIVITY_WIDGET_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(EVE_ACTIVITY_WIDGET_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: EVE Activity
        CFBundleShortVersionString: "$(EVE_MARKETING_VERSION)"
        CFBundleVersion: "$(EVE_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  EVEWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
        excludes:
          - Info.plist
    dependencies:
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(EVE_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(EVE_CODE_SIGN_STYLE)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(EVE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(EVE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(EVE_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(EVE_WATCH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(EVE_WATCH_APP_PROFILE)"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: EVE
        CFBundleShortVersionString: "$(EVE_MARKETING_VERSION)"
        CFBundleVersion: "$(EVE_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(EVE_APP_BUNDLE_ID)"
        WKApplication: true

  EVETests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
    dependencies:
      - target: EVE
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(EVE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(EVE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(EVE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(EVE_APP_BUNDLE_ID).tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EVE.app/EVE"
        BUNDLE_LOADER: "$(TEST_HOST)"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: EVETests
        CFBundleShortVersionString: "$(EVE_MARKETING_VERSION)"
        CFBundleVersion: "$(EVE_BUILD_VERSION)"

  EVELogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
    dependencies:
      - package: EVEKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(EVE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(EVE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(EVE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(EVE_APP_BUNDLE_ID).logic-tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: EVELogicTests
        CFBundleShortVersionString: "$(EVE_MARKETING_VERSION)"
        CFBundleVersion: "$(EVE_BUILD_VERSION)"

  EVEUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: UITests
    dependencies:
      - target: EVE
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(EVE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(EVE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(EVE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(EVE_APP_BUNDLE_ID).ui-tests"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TEST_TARGET_NAME: EVE
        SWIFT_VERSION: "5.0"
    info:
      path: UITests/Info.plist
      properties:
        CFBundleDisplayName: EVEUITests
        CFBundleShortVersionString: "$(EVE_MARKETING_VERSION)"
        CFBundleVersion: "$(EVE_BUILD_VERSION)"
